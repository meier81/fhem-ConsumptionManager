name: Perl regression tests
on:
  push:
    branches: [dev/v1.1.0]
  workflow_dispatch:

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Perl module syntax
        run: |
          for file in lib/ConsumptionManager/*.pm; do
            perl -Ilib -c "$file"
          done
      - name: Run regression tests
        run: prove -Ilib -v t/physical-meter-changes.t
